<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shop - 手機遊戲道具與帳號專賣</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        header p {
            font-size: 14px;
            color: #94a3b8;
        }
        .container {
            display: grid;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #e2e8f0;
        }
        .card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .price {
            font-size: 16px;
            color: #f43f5e;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0284c7;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn:active {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Game Shop</h1>
        <p>安全、快速的手機遊戲道具與帳號交易</p>
    </header>

    <div class="container">
        <!-- 商品 1 -->
        <div class="card">
            <h3>熱門手遊 VIP 初始帳號</h3>
            <p>內含多樣稀有角色與初始資源，進度零負擔隨你玩。</p>
            <div class="price">NT$ 500</div>
            <a href="#" class="btn">立即購買</a>
        </div>

        <!-- 商品 2 -->
        <div class="card">
            <h3>超值道具禮包 A 級</h3>
            <p>大量遊戲通用貨幣與強化素材，助你戰力快速飆升。</p>
            <div class="price">NT$ 150</div>
            <a href="#" class="btn">立即購買</a>
        </div>

        <!-- 商品 3 -->
        <div class="card">
            <h3>稀有造型 / 裝備解鎖</h3>
            <p>限量絕版外觀，讓你在遊戲中成為最吸睛的焦點。</p>
            <div class="price">NT$ 300</div>
            <a href="#" class="btn">立即購買</a>
        </div>
    </div>

</body>
</html>
