<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Shop - 遊戲商店</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }
        .logo {
            height: 60px;
            width: auto;
            margin-bottom: 15px;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #38bdf8;
        }
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            outline: none;
            width: 250px;
        }
        .product-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .buy-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #0284c7;
            color: white;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .buy-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <!-- 你的專屬 Logo -->
        <a href="index.html">
            <img src="logo.png" alt="Logo" class="logo">
        </a>
        
        <!-- 導覽列 -->
        <nav>
            <a href="#">首頁</a>
            <a href="#">遊戲帳號</a>
            <a href="#">商品介紹</a>
            <a href="#">購買須知</a>
        </nav>

        <!-- 搜尋列 -->
        <div class="search-box">
            <input type="text" placeholder="🔍 搜尋商品...">
        </div>
    </header>

    <!-- 商品列表區塊（已移除價格） -->
    <main>
        <div class="product-card">
            <div class="product-title">熱門手遊 VIP 初始帳號</div>
            <div class="product-desc">內含多樣稀有角色與初始資源，進度零負擔隨你玩。</div>
            <a href="#" class="buy-btn">立即購買</a>
        </div>

        <div class="product-card">
            <div class="product-title">超值道具禮包 A 級</div>
            <div class="product-desc">大量遊戲通用貨幣與強化素材，助你戰力快速飆升。</div>
            <a href="#" class="buy-btn">立即購買</a>
        </div>
    </main>

</body>
</html>
